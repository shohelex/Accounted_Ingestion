\* StaleEpochReset off: a former owner takes the epoch of a log the new owner has appended to, appends there and crashes; the new owner forgets its own records, nobody anchors the tail, and the partition is never released.
\* EXPECT: FAIL EventuallyReleased
\* MODULE: AccountedLogs
SPECIFICATION LiveSpec
CONSTANTS
    NSubs = 3
    NLogs = 2
    Consumers = {c1, c2}
    B = 2
    MaxFaults = 2
    MaxTampers = 0
    Fencing = TRUE
    FullDedup = TRUE
    OwnAnchor = TRUE
    RewindOnReset = TRUE
    StaleEpochReset = FALSE
    AdvTruncate = FALSE
    AdvPlant = FALSE
    AdvEpoch = FALSE
INVARIANTS
    TypeOK
PROPERTIES
    EventuallyReleased
CHECK_DEADLOCK FALSE
