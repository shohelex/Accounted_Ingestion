\* EXPECT: FAIL AckedEventuallyAnchored
\* MODULE: Ingest
SPECIFICATION LiveSpec
CONSTANTS
    Events = {e1, e2, e3}
    Poison = {}
    Consumers = {c1, c2}
    K = 2
    B = 2
    MaxRedeliveries = 1
    MaxFaults = 0
    AppendLock = TRUE
    AnchorViaTip = TRUE
    CountOutageFail = FALSE
    Fsync = TRUE
    AuthTip = TRUE
    AdoptStore = TRUE
    Heartbeat = FALSE
    MaxTampers = 0
    AdvClearsPending = FALSE
INVARIANTS
    TypeOK
PROPERTIES
    AckedEventuallyAnchored
CHECK_DEADLOCK FALSE
