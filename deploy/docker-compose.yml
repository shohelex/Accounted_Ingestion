# Single-host deployment of the accounted pipeline. Run from deploy/ after copying .env.example to .env:
#
#   docker compose up -d --build api
#   docker compose exec api python tools/publish_contract.py --partitions 8 --first-acct-offset end
#   docker compose up -d
#
# The contract is published before the writers and the statement maker start.
#
# Kafka (localhost:29092), Neo4j (localhost:7687) and MinIO (localhost:9000) are reachable from the host.

x-env: &env
  NEO4J_URI: "neo4j://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
  REDIS_URL: "redis://redis:6379"
  KAFKA_BOOTSTRAP_SERVERS: '["kafka:9092"]'
  MERKLE_ANCHOR_BACKEND: "s3"
  MERKLE_ANCHOR_S3_ENDPOINT_URL: "http://minio:9000"
  MERKLE_ANCHOR_S3_BUCKET: "anchors"
  AWS_ACCESS_KEY_ID: "${MINIO_USER:-minioadmin}"
  AWS_SECRET_ACCESS_KEY: "${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}"
  AWS_DEFAULT_REGION: "us-east-1"
  MERKLE_SIGNING_SEED: "${MERKLE_SIGNING_SEED:?set MERKLE_SIGNING_SEED in .env}"
  MERKLE_PUBLIC_WITNESS_URL: "${SIGSUM_URL:-https://test.sigsum.org/barreleye}"
  MERKLE_PUBLIC_WITNESS_LOG_KEY: "${SIGSUM_LOG_KEY:-4644af2abd40f4895a003bca350f9d5912ab301a49c77f13e5b6d905c20a5fe6}"
  MERKLE_PUBLIC_WITNESS_POLICY: "/app/deploy/sigsum-test.policy"
  MERKLE_PUBLIC_WITNESS_SEED: "${SIGSUM_SUBMIT_SEED:-}"
  ACCT_MODE: "${ACCT_MODE:-true}"
  ACCT_CAA: "${ACCT_CAA:-true}"
  ACCT_ACK_AFTER_ANCHOR: "${ACCT_ACK_AFTER_ANCHOR:-false}"
  ACCT_ABLATION_OK: "${ACCT_ABLATION_OK:-false}"
  ACCT_PERIOD_S: "${ACCT_PERIOD_S:-360}"
  ACCT_THETA_S: "${ACCT_THETA_S:-300}"
  ACCT_DELTA_PUB_S: "${ACCT_DELTA_PUB_S:-80}"
  MERKLE_APPEND_BATCH_B: "${MERKLE_APPEND_BATCH_B:-32}"
  MERKLE_ANCHOR_BATCH_K: "${MERKLE_ANCHOR_BATCH_K:-100}"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "${RATE_LIMIT_REQUESTS_PER_MINUTE:-1000000}"
  PERIOD_SPOOL_DIR: "/app/spool"
  BOOTSTRAP_API_KEY: "${BOOTSTRAP_API_KEY:-}"
  BOOTSTRAP_TENANT_ID: "${BOOTSTRAP_TENANT_ID:-default}"

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "2G"
      NEO4J_db_transaction_timeout: "30m"
    volumes: [neo4j_data:/data]
    ports: ["127.0.0.1:7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,HOST://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "${PARTITIONS:-8}"
      KAFKA_LOG_RETENTION_HOURS: "168"
    ports: ["127.0.0.1:29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on: {kafka: {condition: service_healthy}}
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "provenance-events",
              "--partitions", "${PARTITIONS:-8}", "--replication-factor", "1",
              "--config", "message.timestamp.type=LogAppendTime", "--config", "retention.ms=604800000",
              "--config", "retention.bytes=-1", "--config", "cleanup.policy=delete"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]

  minio:
    # MinIO no longer publishes images; this is Bitnami's build of RELEASE.2025-04-22T22-12-26Z.
    image: bitnamilegacy/minio:2025.4.22@sha256:50cec18ac4184af4671a78aedd5554942c8ae105d51a465fa82037949046da01
    user: "0:0"
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD}"
    volumes: [minio_data:/data]
    ports: ["127.0.0.1:9000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      retries: 20

  minio-init:
    image: bitnamilegacy/minio-client:2025.4.16@sha256:8a86e441decf053093c5977d49290298295f850c7843652f93e970ab15871dd1
    depends_on: {minio: {condition: service_healthy}}
    user: "0:0"
    entrypoint: ["/opt/bitnami/minio-client/bin/mc"]
    command: ["mb", "--with-lock", "--ignore-existing", "local/anchors"]
    environment:
      MC_HOST_local: "http://${MINIO_USER:-minioadmin}:${MINIO_PASSWORD}@minio:9000"

  api:
    build: {context: .., dockerfile: deploy/Dockerfile}
    image: accounted-ingestion:latest
    environment:
      <<: *env
      WORKERS: "${API_WORKERS:-4}"
      START_STREAM_PROCESSOR: "false"
    volumes: [spool:/app/spool]
    ports: ["8000:8000"]
    depends_on:
      neo4j: {condition: service_healthy}
      kafka: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ >/dev/null"]
      interval: 10s
      retries: 20

  writer:
    image: accounted-ingestion:latest
    command: ["python", "-m", "processing.run_consumer"]
    environment:
      <<: *env
      STREAM_PROCESSORS: "1"
    volumes: [spool:/app/spool]
    depends_on: {api: {condition: service_healthy}}
    deploy: {replicas: "${WRITERS:-4}"}

  maker:
    image: accounted-ingestion:latest
    command: ["python", "-m", "processing.run_maker"]
    environment: *env
    volumes: [spool:/app/spool]
    depends_on: {api: {condition: service_healthy}}

volumes:
  neo4j_data:
  minio_data:
  spool:
